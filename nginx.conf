server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-приложение под своим base-путём
    location /family-stock-tracker/ {
        try_files $uri $uri/ /family-stock-tracker/index.html;
    }

    # Service worker и manifest не кэшируем жёстко (PWA autoUpdate)
    location = /family-stock-tracker/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /family-stock-tracker/manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Статика с кэшем
    location /family-stock-tracker/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}